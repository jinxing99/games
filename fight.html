<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>激斗 GEKIDO · 格斗之王</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; user-select:none; -webkit-user-select:none; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  #game { position:fixed; left:0; top:0; display:block; }
  /* 触屏按钮 */
  #touch-ui { position:fixed; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:20; }
  .tbtn { position:absolute; pointer-events:auto; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.35);
    color:#fff; font-weight:bold; backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
    transition:background .06s, transform .06s; }
  .tbtn.on { background:rgba(255,210,60,.45); border-color:#ffd23c; transform:scale(.92); }
  .tbtn.atk { background:rgba(230,70,60,.22); border-color:rgba(255,120,100,.55); }
  .tbtn.atk.on { background:rgba(255,80,60,.55); }
  .tbtn.sp { background:rgba(90,140,255,.22); border-color:rgba(140,180,255,.6); }
  .tbtn.sp.max { box-shadow:0 0 18px 4px rgba(120,180,255,.8); animation:pulse .5s infinite alternate; }
  @keyframes pulse { from{transform:scale(1)} to{transform:scale(1.1)} }
  /* 横屏提示 */
  #rotate-tip { position:fixed; inset:0; z-index:99; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center,#1a2233 0%,#05070c 80%); color:#fff; text-align:center; padding:20px; }
  #rotate-tip .phone { width:54px; height:96px; border:4px solid #ffd23c; border-radius:10px; margin-bottom:18px;
    animation:rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%,20%{transform:rotate(0)} 55%,100%{transform:rotate(90deg)} }
  #rotate-tip h2 { font-size:20px; letter-spacing:4px; margin-bottom:10px; color:#ffd23c; }
  #rotate-tip p { font-size:13px; color:#aab; line-height:1.8; }
  #rotate-tip button { margin-top:18px; padding:12px 34px; font-size:16px; letter-spacing:3px; font-weight:bold;
    color:#1a1200; background:linear-gradient(180deg,#ffe27a,#f5b521); border:none; border-radius:30px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touch-ui"></div>
<div id="rotate-tip">
  <div class="phone"></div>
  <h2>请横屏游玩</h2>
  <p>1. 确认系统「自动旋转」已开启<br>2. 或点击下方按钮一键横屏</p>
  <button id="btn-rotate">一键横屏</button>
</div>

<script>
'use strict';
/* =====================================================================
 * 激斗 GEKIDO —— 拳皇式 1v1 格斗（单文件 / 零依赖 / 触屏横屏）
 * 模式：单人挑战CPU / 双人同屏
 * ===================================================================== */

// ---------------- 画布与适配（按高度铺满，横向视野扩展） ----------------
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const VIEW_H = 720;                 // 逻辑高度固定
let viewW = 1280;                   // 逻辑宽度随屏幕比例动态扩展
let scaleRatio = 1, dpr = 1;
const GROUND_Y = 618;               // 地面逻辑Y

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.round(innerWidth * dpr);
  cvs.height = Math.round(innerHeight * dpr);
  cvs.style.width = innerWidth + 'px';
  cvs.style.height = innerHeight + 'px';
  scaleRatio = cvs.height / VIEW_H;
  viewW = cvs.width / scaleRatio;
}
window.addEventListener('resize', resize);
resize();

// ---------------- 音效（WebAudio 程序合成） ----------------
let AC = null, bgmTimer = null, bgmBeat = 0;
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type, vol, slideTo) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo, 1), AC.currentTime + dur);
  g.gain.setValueAtTime(vol || .15, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}
function noise(dur, vol, freq) {
  if (!AC) return;
  const len = AC.sampleRate * dur, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = .8;
  const g = AC.createGain(); g.gain.setValueAtTime(vol || .2, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
}
const SFX = {
  swing()  { noise(.09, .10, 900); },
  hit()    { noise(.12, .30, 500); tone(180, .10, 'sine', .35, 60); },
  hitHard(){ noise(.18, .38, 350); tone(120, .18, 'sine', .45, 40); },
  block()  { tone(1800, .05, 'square', .12); noise(.05, .12, 2500); },
  jump()   { tone(300, .12, 'sine', .08, 700); },
  land()   { noise(.07, .12, 300); },
  wave()   { tone(220, .3, 'sawtooth', .18, 900); },
  boom()   { noise(.35, .4, 220); tone(90, .3, 'sine', .4, 35); },
  shoryu() { tone(150, .35, 'sawtooth', .22, 800); },
  ko()     { tone(400, .8, 'sawtooth', .3, 50); noise(.6, .35, 150); },
  fight()  { tone(660, .09, 'square', .2); setTimeout(() => tone(990, .22, 'square', .22), 110); },
  beep()   { tone(880, .07, 'square', .12); },
  select() { tone(520, .06, 'square', .15); },
  confirm(){ tone(660, .08, 'square', .18); setTimeout(() => tone(880, .1, 'square', .18), 80); },
  win()    { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .25, 'triangle', .2), i * 130)); }
};
const BASS_SEQ = [55, 0, 55, 61.7, 55, 0, 73.4, 49];
function bgmStart() {
  if (!AC || bgmTimer) return;
  bgmTimer = setInterval(() => {
    bgmBeat = (bgmBeat + 1) % 8;
    if (bgmBeat % 4 === 0) tone(70, .12, 'sine', .16, 40);
    if (bgmBeat % 2 === 1) noise(.04, .05, 6000);
    const n = BASS_SEQ[bgmBeat];
    if (n) tone(n, .16, 'sawtooth', .06);
  }, 210);
}
function bgmStop() { clearInterval(bgmTimer); bgmTimer = null; }

// ---------------- 姿态关键帧（x向前为正，y向上为正） ----------------
const POSES = {
  idle:    { head:[5,88],  chest:[5,64], hip:[1,38], handF:[24,72], handB:[-12,46], footF:[20,0], footB:[-22,0] },
  crouch:  { head:[6,56],  chest:[2,40], hip:[-4,20], handF:[24,32], handB:[-12,28], footF:[18,0], footB:[-20,0] },
  jump:    { head:[0,92],  chest:[0,70], hip:[-2,44], handF:[20,60], handB:[-16,56], footF:[12,22], footB:[-14,24] },
  punch:   { head:[16,94], chest:[12,72],hip:[-2,42], handF:[62,68], handB:[-18,54], footF:[24,0], footB:[-20,0] },
  punchC:  { head:[14,54], chest:[10,38],hip:[-4,18], handF:[56,34], handB:[-14,26], footF:[22,0], footB:[-24,0] },
  kick:    { head:[-6,92], chest:[-6,70],hip:[0,42],  handF:[16,62], handB:[-22,58], footF:[66,46], footB:[-16,0] },
  kickC:   { head:[2,50],  chest:[0,34], hip:[-6,14], handF:[20,24], handB:[-16,22], footF:[62,5],  footB:[-18,0] },
  airAtk:  { head:[6,86],  chest:[4,64], hip:[0,40],  handF:[20,58], handB:[-16,54], footF:[58,26], footB:[-12,30] },
  hurt:    { head:[-16,92],chest:[-9,70],hip:[-2,42], handF:[10,66], handB:[-26,56], footF:[12,0], footB:[-22,0] },
  block:   { head:[-2,94], chest:[-2,72],hip:[-2,42], handF:[18,74], handB:[15,58],  footF:[12,0], footB:[-18,0] },
  blockC:  { head:[2,54],  chest:[0,38], hip:[-4,18], handF:[18,42], handB:[14,30],  footF:[16,0], footB:[-20,0] },
  down:    { head:[-54,14],chest:[-30,10],hip:[-8,8], handF:[-42,6], handB:[-20,16], footF:[30,4], footB:[46,10] },
  win:     { head:[0,98],  chest:[0,74], hip:[0,44],  handF:[14,112],handB:[-16,56], footF:[14,0], footB:[-16,0] },
  spWave:  { head:[8,92],  chest:[6,70], hip:[-2,42], handF:[46,64], handB:[40,54],  footF:[26,0], footB:[-22,0] },
  spRise:  { head:[6,98],  chest:[4,74], hip:[0,44],  handF:[18,120],handB:[-16,54], footF:[14,18], footB:[-14,20] }
};
function lerpPose(a, b, t) {
  const o = {};
  for (const k in a) o[k] = [a[k][0] + (b[k][0] - a[k][0]) * t, a[k][1] + (b[k][1] - a[k][1]) * t];
  return o;
}

// ---------------- 角色数据 ----------------
const CHARS = [
  {
    id: 'rei', name: '烈', en: 'REI', color: '#3f8fe8', sub: '#bcdcff', skin: '#f2c89a', hair: '#26303e',
    hp: 950, walk: 4.5, jumpV: 16.5,
    desc: '速度型武道家', specialName: '气功波', stats: { 速度: 5, 力量: 3, 体力: 3 },
    moves: {
      punch:  { startup: 5, active: 4, recover: 9,  dmg: 34, hitstun: 14, blockstun: 9,  push: 3,   level: 'high', pt: 'handF' },
      punchC: { startup: 6, active: 4, recover: 10, dmg: 30, hitstun: 13, blockstun: 9,  push: 2.5, level: 'high', pt: 'handF' },
      kick:   { startup: 9, active: 5, recover: 14, dmg: 52, hitstun: 18, blockstun: 12, push: 4.5, level: 'high', pt: 'footF' },
      kickC:  { startup: 8, active: 5, recover: 16, dmg: 44, hitstun: 16, blockstun: 11, push: 3.5, level: 'low',  pt: 'footF', knockdown: true },
      air:    { startup: 6, active: 99,recover: 6,  dmg: 46, hitstun: 16, blockstun: 11, push: 3.5, level: 'mid',  pt: 'footF' },
      special:{ startup: 14,active: 0, recover: 24, type: 'wave', dmg: 100, chip: 12, waveSpeed: 7.5 }
    }
  },
  {
    id: 'gou', name: '刚', en: 'GOU', color: '#d84a3a', sub: '#ffd9b0', skin: '#e8b184', hair: '#3a1f16',
    hp: 1120, walk: 3.1, jumpV: 15,
    desc: '力量型格斗家', specialName: '升龙拳', stats: { 速度: 3, 力量: 5, 体力: 5 },
    moves: {
      punch:  { startup: 8, active: 4, recover: 12, dmg: 55, hitstun: 17, blockstun: 10, push: 4,   level: 'high', pt: 'handF' },
      punchC: { startup: 9, active: 4, recover: 13, dmg: 48, hitstun: 15, blockstun: 10, push: 3.5, level: 'high', pt: 'handF' },
      kick:   { startup: 12,active: 5, recover: 17, dmg: 72, hitstun: 20, blockstun: 13, push: 5.5, level: 'high', pt: 'footF' },
      kickC:  { startup: 10,active: 5, recover: 18, dmg: 60, hitstun: 18, blockstun: 12, push: 4.5, level: 'low',  pt: 'footF', knockdown: true },
      air:    { startup: 7, active: 99,recover: 6,  dmg: 60, hitstun: 17, blockstun: 12, push: 4,   level: 'mid',  pt: 'footF' },
      special:{ startup: 8, active: 14,recover: 26, type: 'rise', dmg: 140, chip: 15, hitstun: 20, launch: true, pt: 'handF' }
    }
  }
];

// ---------------- 特效 ----------------
const particles = [];
let camShake = 0, hitstop = 0, slowmo = 0, flashWhite = 0;
function spark(x, y, color, n, spd) {
  for (let i = 0; i < (n || 12); i++) {
    const a = Math.random() * Math.PI * 2, v = (Math.random() * .6 + .4) * (spd || 8);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 18 + Math.random() * 12, t: 0, color, r: 2 + Math.random() * 4 });
  }
}
function updateFX() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t++; p.x += p.vx; p.y += p.vy; p.vy += .45;
    if (p.t > p.life) particles.splice(i, 1);
  }
  if (camShake > 0) camShake *= .82;
}

// ---------------- 输入 ----------------
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; audioInit(); if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.code] = false; });
const touchState = [{}, {}];   // 两名玩家触屏输入
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function readKeyboard(p) {
  if (p === 0) return {
    left: !!keys.KeyA, right: !!keys.KeyD, up: !!keys.KeyW, down: !!keys.KeyS,
    punch: !!keys.KeyJ, kick: !!keys.KeyK, special: !!keys.KeyL
  };
  return {
    left: !!keys.ArrowLeft, right: !!keys.ArrowRight, up: !!keys.ArrowUp, down: !!keys.ArrowDown,
    punch: !!(keys.Numpad1 || keys.Digit1), kick: !!(keys.Numpad2 || keys.Digit2), special: !!(keys.Numpad3 || keys.Digit3)
  };
}
function mergedInput(p) {
  const k = readKeyboard(p), t = touchState[p];
  return {
    left: k.left || !!t.left, right: k.right || !!t.right, up: k.up || !!t.up, down: k.down || !!t.down,
    punch: k.punch || !!t.punch, kick: k.kick || !!t.kick, special: k.special || !!t.special
  };
}

// ---------------- 角色实体 ----------------
const PROJECTILES = [];
class Fighter {
  constructor(charIdx, player) {
    this.char = CHARS[charIdx];
    this.player = player;
    this.maxHp = this.char.hp;
    this.reset(player === 0 ? 0 : 1);
    this.roundWins = 0;
    this.in = { left: 0, right: 0, up: 0, down: 0, punch: 0, kick: 0, special: 0 };
    this.prevIn = { ...this.in };
    this.ai = { think: 0, act: null, actT: 0 };
    this.animPose = { ...POSES.idle };
    this.walkPhase = 0;
  }
  reset(side) {
    this.hp = this.maxHp;
    this.energy = 0;
    this.x = side === 0 ? viewW * 0.3 : viewW * 0.7;
    this.y = 0; this.vx = 0; this.vy = 0;
    this.facing = side === 0 ? 1 : -1;
    this.state = 'idle'; this.stateTime = 0;
    this.stun = 0; this.combo = 0; this.comboTimer = 0;
    this.curMove = null; this.moveHit = false; this.canCancel = false;
    this.airAtkUsed = false; this.spPhase = 0;
  }
  get onGround() { return this.y <= 0; }
  get isAtk() { return ['punch','punchC','kick','kickC','air','special'].includes(this.state); }
  get isDown() { return this.state === 'down' || this.state === 'getup'; }
  get crouching() { return ['crouch','punchC','kickC','blockC'].includes(this.state); }
  get busy() { return this.isAtk || this.stun > 0 || this.isDown || ['hurt','block','blockC'].includes(this.state); }
  opp() { return game.fighters[1 - this.player]; }

  hurtbox() {
    const h = this.crouching ? 62 : 108;
    return { x0: this.x - 24, x1: this.x + 24, y0: this.y, y1: this.y + h };
  }
  // 攻击判定点的世界坐标（取完全伸展pose，不用动画插值，保证判定精确）
  attackPoint() {
    const m = this.curMove;
    const poseKey = this.state === 'special' ? (m.type === 'wave' ? 'spWave' : 'spRise') : this.state;
    const p = POSES[poseKey][m.pt || 'handF'];
    return { x: this.x + p[0] * this.facing, y: this.y + p[1] };
  }

  startState(s) {
    this.state = s; this.stateTime = 0;
    if (this.char.moves[s]) {
      this.curMove = this.char.moves[s];
      this.moveHit = false; this.canCancel = false;
      SFX.swing();
    }
  }
  tryAttack(name) {
    if (name === 'special') {
      if (this.energy < 100 || this.state === 'special') return false;
      this.energy = 0; this.spPhase = 0;
      this.startState('special');
      if (this.curMove.type === 'wave') SFX.wave(); else SFX.shoryu();
      return true;
    }
    this.startState(name);
    return true;
  }

  update() {
    const o = this.opp();
    this.stateTime++;
    if (this.stun > 0) this.stun--;
    if (this.comboTimer > 0 && --this.comboTimer === 0) this.combo = 0;

    // 朝向（地面自由状态时自动面向对手）
    if (!this.busy && this.onGround) this.facing = o.x >= this.x ? 1 : -1;

    const fwd  = this.facing === 1 ? this.in.right : this.in.left;
    const back = this.facing === 1 ? this.in.left : this.in.right;
    const pPunch = this.in.punch && !this.prevIn.punch;
    const pKick  = this.in.kick && !this.prevIn.kick;
    const pSp    = this.in.special && !this.prevIn.special;

    switch (this.state) {
      case 'idle': case 'walk': {
        if (pPunch) { this.tryAttack('punch'); break; }
        if (pKick)  { this.tryAttack('kick'); break; }
        if (pSp)    { if (this.tryAttack('special')) break; }
        if (this.in.up) {
          this.vy = this.char.jumpV;
          let dir = fwd ? 1 : back ? -0.7 : 0.2;
          this.vx = dir * this.char.walk * 0.95 * this.facing;
          this.state = 'jump'; this.stateTime = 0; this.airAtkUsed = false; SFX.jump(); break;
        }
        if (this.in.down) { this.state = 'crouch'; this.stateTime = 0; break; }
        if (back) { this.state = 'block'; this.stateTime = 0; break; }
        if (fwd) { this.state = 'walk'; this.walkPhase += .28; this.x += this.char.walk * this.facing; }
        else this.state = 'idle';
        break;
      }
      case 'crouch': {
        if (pPunch) { this.tryAttack('punchC'); break; }
        if (pKick)  { this.tryAttack('kickC'); break; }
        if (pSp)    { if (this.tryAttack('special')) break; }
        if (!this.in.down) { this.state = 'idle'; break; }
        this.state = back ? 'blockC' : 'crouch';
        break;
      }
      case 'block': {
        if (this.stun > 0) break;
        if (!back) this.state = this.in.down ? 'crouch' : 'idle';
        else if (this.in.down) this.state = 'blockC';
        break;
      }
      case 'blockC': {
        if (this.stun > 0) break;
        if (!back || !this.in.down) this.state = back ? 'block' : (this.in.down ? 'crouch' : 'idle');
        break;
      }
      case 'jump': {
        if ((pPunch || pKick) && !this.airAtkUsed) { this.airAtkUsed = true; this.tryAttack('air'); }
        break;
      }
      case 'air': {
        // 空中攻击持续到落地
        break;
      }
      case 'punch': case 'punchC': case 'kick': case 'kickC': {
        const m = this.curMove, total = m.startup + m.active + m.recover;
        // 连招取消窗口
        if (this.canCancel) {
          if (pKick && this.state !== 'kick' && this.state !== 'kickC') { this.tryAttack(this.crouching ? 'kickC' : 'kick'); break; }
          if (pPunch && this.state !== 'punch' && this.state !== 'punchC') { this.tryAttack(this.crouching ? 'punchC' : 'punch'); break; }
          if (pSp && this.tryAttack('special')) break;
        }
        if (this.stateTime >= total) this.state = this.crouching ? 'crouch' : 'idle';
        break;
      }
      case 'special': {
        const m = this.curMove;
        if (m.type === 'wave') {
          if (this.stateTime === m.startup) {
            PROJECTILES.push({ x: this.x + 50 * this.facing, y: this.y + 58, vx: m.waveSpeed * this.facing, owner: this.player, dmg: m.dmg, chip: m.chip, life: 200, char: this.char });
          }
          if (this.stateTime >= m.startup + m.recover) this.state = 'idle';
        } else { // rise 升龙
          if (this.stateTime === m.startup) { this.vy = 15; this.vx = 5.5 * this.facing; }
          if (this.stateTime > m.startup + m.active && this.onGround && this.stateTime > m.startup + m.active + m.recover * .4) this.state = 'idle';
        }
        break;
      }
      case 'hurt': {
        if (this.stun <= 0) this.state = 'idle';
        break;
      }
      case 'down': {
        if (this.stateTime > 45) { this.state = 'getup'; this.stateTime = 0; }
        break;
      }
      case 'getup': {
        if (this.stateTime > 16) this.state = 'idle';
        break;
      }
      case 'win': case 'lose': break;
    }

    // 物理
    if (!this.onGround || this.vy > 0) {
      this.vy -= 0.85; this.y += this.vy; this.x += this.vx;
      if (this.y <= 0) {
        this.y = 0; this.vy = 0; this.vx = 0;
        if (this.state === 'jump') this.state = 'idle';
        else if (this.state === 'air') { this.state = 'idle'; this.stun = 4; }
        else if (this.state === 'airHurt') { this.state = 'down'; this.stateTime = 0; SFX.land(); spark(this.x, 8, '#997755', 8, 5); }

    this.x = Math.max(70, Math.min(viewW - 70, this.x));
    // 角色间推挤
    if (this.onGround && o.onGround && !this.isDown && !o.isDown) {

      if (Math.abs(dx) < minD) {

// ---------------- AI ----------------
function aiThink(f) {
  const ai = f.ai, o = f.opp();
  const blank = { left: 0, right: 0, up: 0, down: 0, punch: 0, kick: 0, special: 0 };
  if (f.busy || game.phase !== 'fight') { f.in = blank; return; }
  const dist = Math.abs(o.x - f.x);
  const toOpp = o.x > f.x ? 'right' : 'left';
  const away = o.x > f.x ? 'left' : 'right';

  if (--ai.think <= 0) {
    ai.think = 9 + (Math.random() * 10 | 0);
    const r = Math.random();
    ai.act = null;
    // 对手发波且接近 → 跳
    const waveNear = PROJECTILES.some(p => p.owner !== f.player && Math.abs(p.x - f.x) < 180 && Math.abs(p.y - (f.y + 60)) < 70);
    if (waveNear && r < .65) ai.act = { t: 14, keys: { up: 1, [toOpp]: 1 } };
    // 对手空中接近且我有升龙
    else if (!o.onGround && dist < 130 && f.char.moves.special.type === 'rise' && f.energy >= 100 && r < .6) ai.act = { t: 4, keys: { special: 1 } };
    // 对手攻击前摇 → 防御
    else if (o.isAtk && dist < 160 && r < .6) ai.act = { t: 12, keys: { [away]: 1, down: o.curMove && o.curMove.level === 'low' ? 1 : 0 } };
    else if (f.energy >= 100 && f.char.moves.special.type === 'wave' && dist > 280 && r < .4) ai.act = { t: 4, keys: { special: 1 } };
    else if (dist > 220) {
      if (r < .7) ai.act = { t: 14, keys: { [toOpp]: 1 } };
      else if (r < .85) ai.act = { t: 16, keys: { up: 1, [toOpp]: 1 } };
    } else if (dist > 110) {
      if (r < .4) ai.act = { t: 10, keys: { [toOpp]: 1 } };
      else if (r < .62) ai.act = { t: 8, keys: { kick: 1 } };
      else if (r < .75) ai.act = { t: 10, keys: { [away]: 1 } };
      else if (r < .87) ai.act = { t: 14, keys: { up: 1, [toOpp]: 1, kick: 1 } };
    } else {
      if (r < .32) ai.act = { t: 6, keys: { punch: 1 } };
      else if (r < .5) ai.act = { t: 6, keys: { punch: 1, _then: { kick: 1 } } };
      else if (r < .62) ai.act = { t: 8, keys: { down: 1, kick: 1 } };
      else if (r < .8) ai.act = { t: 10, keys: { [away]: 1 } };
      else ai.act = { t: 8, keys: { [away]: 1, down: 1 } };
    }
    ai.actT = 0;
  }
  f.in = { ...blank };
  if (ai.act) {
    for (const k in ai.act.keys) if (k !== '_then') f.in[k] = ai.act.keys[k];
    // 连招：前段命中后接
    if (ai.act.keys._then && f.canCancel) for (const k in ai.act.keys._then) f.in[k] = 1;
    if (++ai.actT >= ai.act.t) ai.act = null;
  }
}

// ---------------- 命中判定 ----------------
function hurtboxHit(hb, px, py, r) {
  return px + r > hb.x0 && px - r < hb.x1 && py + r > hb.y0 && py - r < hb.y1;
}
function resolveHit(att, def, dmg, o) {
  o = o || {};
  if (def.isDown) return false; // 倒地无敌
  // 防御判定
  const blocking = (def.state === 'block' || def.state === 'blockC') && def.stun >= 0;
  let blocked = false;
  if (blocking) {
    const lv = o.level || 'high';
    if (lv === 'high') blocked = true;
    else if (lv === 'low') blocked = def.state === 'blockC';
    else if (lv === 'mid') blocked = def.state === 'block';
  }
  const pt = o.point || { x: (att.x + def.x) / 2, y: def.y + 70 };
  if (blocked) {
    const chip = o.chip || 0;
    def.hp = Math.max(1, def.hp - chip);
    def.stun = o.blockstun || 10;
    def.state = def.state === 'blockC' ? 'blockC' : 'block';
    def.vx = 0; def.x += (o.push || 3) * Math.sign(def.x - att.x);
    def.energy = Math.min(100, def.energy + 3);
    att.energy = Math.min(100, att.energy + 4);
    SFX.block();
    spark(pt.x, GROUND_Y - pt.y, '#7fbfff', 6, 4);
    hitstop = 3;
    att.canCancel = true;
    return true;
  }
  // 命中
  def.hp -= dmg;
  def.combo = 0;
  att.combo++; att.comboTimer = 100;
  att.energy = Math.min(100, att.energy + 7);
  def.energy = Math.min(100, def.energy + 5);
  const dir = Math.sign(def.x - att.x) || att.facing;
  if (o.launch || o.knockdown) {
    def.state = 'airHurt'; def.stateTime = 0;
    def.vy = o.launch ? 13 : 8; def.vx = dir * (o.launch ? 4 : 6);
    def.stun = 30;
  } else {
    def.state = def.crouching ? 'hurt' : 'hurt';
    def.stateTime = 0; def.stun = o.hitstun || 14;
    def.x += (o.push || 3) * dir * 2;
  }
  if (def.hp <= 0) { def.hp = 0; }
  const heavy = dmg >= 50;
  heavy ? SFX.hitHard() : SFX.hit();
  spark(pt.x, GROUND_Y - pt.y, heavy ? '#ffd23c' : '#ff8c5a', heavy ? 16 : 10, heavy ? 10 : 7);
  hitstop = heavy ? 7 : 4;
  camShake = heavy ? 9 : 5;
  att.canCancel = true;
  return true;
}

function checkAttackHits(att, def) {
  if (!att.isAtk || att.moveHit) return;
  const m = att.curMove;
  if (att.state === 'special' && m.type === 'wave') return; // 波由弹体判定
  let active = false;
  if (att.state === 'air') active = true;
  else if (att.state === 'special' && m.type === 'rise') active = att.stateTime >= m.startup && att.stateTime <= m.startup + m.active;
  else active = att.stateTime >= m.startup && att.stateTime < m.startup + m.active;
  if (!active) return;
  const pt = att.attackPoint();
  if (hurtboxHit(def.hurtbox(), pt.x, pt.y, 30)) {
    if (resolveHit(att, def, m.dmg, m)) att.moveHit = true;
  }
}

// ---------------- 游戏流程 ----------------
const game = {
  scene: 'menu',            // menu | select | fight | end
  mode: 0,                  // 0=人机 1=双人
  fighters: [null, null],
  sel: [0, 1], selDone: [false, false],
  phase: 'intro', phaseT: 0,
  round: 1, timer: 60 * 60,
  winner: -1, menuSel: 0,
  msg: '', msgT: 0
};

function startMatch() {
  game.fighters = [new Fighter(game.sel[0], 0), new Fighter(game.sel[1], 1)];
  game.fighters[1].isAI = game.mode === 0;
  game.round = 1;
  startRound();
  game.scene = 'fight';
}
function startRound() {
  game.fighters[0].reset(0);
  game.fighters[1].reset(1);
  hpLag[0] = hpLag[1] = 1;
  PROJECTILES.length = 0;
  game.phase = 'intro'; game.phaseT = 0;
  game.timer = 60 * 60;
  game.msg = 'ROUND ' + game.round; game.msgT = 0;
  bgmStop();
}

function updateFight() {
  const [a, b] = game.fighters;
  game.phaseT++;

  if (game.phase === 'intro') {
    if (game.phaseT === 70) { game.msg = 'FIGHT!'; game.msgT = 0; SFX.fight(); bgmStart(); }
    if (game.phaseT > 100) { game.phase = 'fight'; game.msgT = 0; }
  } else if (game.phase === 'fight') {
    if (--game.timer <= 0) {
      game.timer = 0;
      endRound(a.hp === b.hp ? -2 : (a.hp > b.hp ? 0 : 1), 'TIME OVER');
    }
    if (a.hp <= 0 || b.hp <= 0) {
      const w = a.hp <= 0 && b.hp <= 0 ? -2 : (a.hp <= 0 ? 1 : 0);
      endRound(w, 'K.O.');
      SFX.ko(); slowmo = 90; camShake = 14; flashWhite = 12;
      const loser = game.fighters[1 - (w === -2 ? 0 : w)];
      loser.state = 'airHurt'; loser.vy = 10; loser.vx = (loser.x > (w === -2 ? 0 : w ? a : b).x ? 1 : -1) * 5; loser.stun = 99;
    }
  } else if (game.phase === 'roundEnd') {
    if (game.phaseT > 150) {
      const aw = a.roundWins, bw = b.roundWins;
      if (aw >= 2 || bw >= 2) {
        game.winner = aw >= 2 ? 0 : 1;
        game.fighters[game.winner].state = 'win';
        game.fighters[1 - game.winner].state = 'lose';
        game.scene = 'end'; bgmStop(); SFX.win();
      } else {
        game.round++;
        startRound();
      }
    }
  }
  if (game.msgT !== undefined) game.msgT++;

  // 输入与更新
  const frozen = game.phase === 'intro' || game.phase === 'roundEnd';
  for (const f of game.fighters) {
    if (frozen) { f.in = { left: 0, right: 0, up: 0, down: 0, punch: 0, kick: 0, special: 0 }; f.prevIn = { ...f.in }; }
    else if (f.isAI) aiThink(f);
    else f.in = mergedInput(f.player);
    if (slowmo > 0) { if (game.phaseT % 3 === 0) f.update(); }
    else f.update();
  }
  if (slowmo > 0) slowmo--;

  // 攻击判定
  checkAttackHits(a, b);
  checkAttackHits(b, a);

  // 飞行道具
  for (let i = PROJECTILES.length - 1; i >= 0; i--) {
    const p = PROJECTILES[i];
    p.x += p.vx; p.life--;
    if (Math.random() < .5) spark(p.x, GROUND_Y - p.y, '#8fd0ff', 1, 2);
    const target = game.fighters[1 - p.owner];
    if (hurtboxHit(target.hurtbox(), p.x, p.y, 22)) {
      resolveHit(game.fighters[p.owner], target, p.dmg, { level: 'high', chip: p.chip, hitstun: 18, blockstun: 12, push: 5, point: { x: p.x, y: p.y } });
      spark(p.x, GROUND_Y - p.y, '#bfe6ff', 18, 9); SFX.boom();
      PROJECTILES.splice(i, 1); continue;
    }
    if (p.life <= 0 || p.x < -50 || p.x > viewW + 50) PROJECTILES.splice(i, 1);
  }
  updateFX();
}

function endRound(w, text) {
  if (game.phase !== 'fight') return;
  game.phase = 'roundEnd'; game.phaseT = 0;
  game.msg = text; game.msgT = 0;
  if (w >= 0) {
    game.fighters[w].roundWins++;
    game.fighters[w].state = 'win';
  }
  bgmStop();
}

// ---------------- 渲染 ----------------
function drawFighterFigure(f, px, py, pose, s, alpha) {
  // px,py = 脚部中心屏幕坐标；s = 缩放
  const c = f.char;

    ctx.beginPath();
    ctx.moveTo(fp[0] - 7, fy);
    ctx.lineTo(fp[0] + 7, fy);
    ctx.lineTo(fp[0] + 13, fy - 4);
    ctx.lineTo(fp[0] + 2, fy - 7);
    ctx.lineTo(fp[0] - 7, fy - 7);
    ctx.closePath(); ctx.fill();
  };

  const shoulderB = [pose.chest[0] - 2, pose.chest[1] + 4];

  // 后臂后腿（暗色）
  const dim = shade(c.color, -40);
  const elbowB = joint(shoulderB, pose.handB, -6);
  seg(shoulderB, elbowB, 5.5, dim); seg(elbowB, pose.handB, 5.5, dim);
  ctx.fillStyle = dim; ctx.beginPath(); ctx.arc(pose.handB[0], -pose.handB[1], 7, 0, 7); ctx.fill();

  ctx.fillStyle = c.hair;
  ctx.beginPath(); ctx.arc(hx - 2, hy, 12, Math.PI * 0.5, Math.PI * 1.5); ctx.fill();
  // 脸（前半圆，皮肤，朝前）

  // 头带（额前横带）
  ctx.fillStyle = c.color;
  ctx.fillRect(hx - 13, hy - 9, 26, 5.5);
  // 飘带（脑后，明确向后飘）
  ctx.strokeStyle = shade(c.color, -25); ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(hx - 12, hy - 7); ctx.lineTo(hx - 27, hy - 12);
  ctx.moveTo(hx - 12, hy - 4); ctx.lineTo(hx - 23, hy - 1); ctx.stroke();
  // 眼睛（脸前部，大眼白+黑瞳+眉）
  ctx.fillStyle = '#fff'; ctx.fillRect(hx + 4, hy - 5, 7, 6.5);
  ctx.fillStyle = '#203040'; ctx.fillRect(hx + 8, hy - 3.5, 3, 4);
  ctx.fillRect(hx + 4, hy - 7.5, 7, 1.8); // 眉
  // 嘴

function shade(hex, amt) {

function currentPose(f) {
  let target = POSES.idle;
  const m = f.curMove;
  switch (f.state) {
    case 'idle': target = POSES.idle; break;
    case 'walk': target = POSES.idle; break;
    case 'crouch': target = POSES.crouch; break;
    case 'block': target = POSES.block; break;
    case 'blockC': target = POSES.blockC; break;
    case 'jump': target = POSES.jump; break;
    case 'hurt': target = f.y > 0 ? POSES.hurt : POSES.hurt; break;
    case 'airHurt': target = POSES.hurt; break;
    case 'down': case 'getup': case 'lose': target = POSES.down; break;
    case 'win': target = POSES.win; break;
    case 'punch': target = POSES.punch; break;
    case 'punchC': target = POSES.punchC; break;
    case 'kick': target = POSES.kick; break;
    case 'kickC': target = POSES.kickC; break;
    case 'air': target = POSES.airAtk; break;
    case 'special': target = m && m.type === 'wave' ? POSES.spWave : POSES.spRise; break;
  }

  let speed = .35;
  if (f.isAtk && f.state !== 'special') {
    const st = f.stateTime;
    if (st >= m.startup - 1) speed = 1; // 出招瞬间到位
  }
  if (f.state === 'special' && f.stateTime >= (m ? m.startup : 0) - 1) speed = 1;
  if (f.state === 'hurt' || f.state === 'airHurt') speed = .8;
  f.animPose = lerpPose(f.animPose, target, speed);
  // 走路程序动画
  if (f.state === 'walk') {
    const p = f.walkPhase;
    f.animPose.footF = [16 + Math.sin(p) * 14, Math.max(0, Math.cos(p)) * 10];
    f.animPose.footB = [-16 + Math.sin(p + Math.PI) * 14, Math.max(0, Math.cos(p + Math.PI)) * 10];
    f.animPose.chest = [f.animPose.chest[0], f.animPose.chest[1] + Math.abs(Math.sin(p)) * 2];
  }
  if (f.state === 'idle') { // 呼吸
    const b = Math.sin(Date.now() * .004 + f.player * 2) * 1.6;
    f.animPose.chest = [f.animPose.chest[0], f.animPose.chest[1] + b];
    f.animPose.head = [f.animPose.head[0], f.animPose.head[1] + b];
  }
  return f.animPose;
}

function drawBar(x, y, w, h, ratio, mirror, lag, color) {

const hpLag = [1, 1];

function drawHUD() {

  // 名字
  ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = a.char.color; ctx.fillText(a.char.name + ' ' + a.char.en, viewW / 2 - 66 - bw, top + bh + 22);
  ctx.fillStyle = b.char.color; ctx.textAlign = 'right'; ctx.fillText(b.char.name + ' ' + b.char.en, viewW / 2 + 66 + bw, top + bh + 22);
  // 回合格点
  for (let i = 0; i < 2; i++) {
    ctx.beginPath(); ctx.arc(viewW / 2 - 46 + i * 0 - 0, top + 60, 7, 0, 7);
    ctx.fillStyle = a.roundWins > i ? '#ffd23c' : 'rgba(255,255,255,.2)'; ctx.fill();
    ctx.beginPath(); ctx.arc(viewW / 2 + 46 - i * 0 + 0, top + 60, 7, 0, 7);
    ctx.fillStyle = b.roundWins > i ? '#ffd23c' : 'rgba(255,255,255,.2)'; ctx.fill();
  }
  // 计时器
  ctx.fillStyle = '#0c0c14'; ctx.beginPath(); ctx.arc(viewW / 2, top + bh / 2 + 2, 34, 0, 7); ctx.fill();
  ctx.strokeStyle = '#ffd23c'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = game.timer < 600 ? '#ff5040' : '#fff';
  ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(Math.ceil(game.timer / 60), viewW / 2, top + bh / 2 + 4);
  ctx.textBaseline = 'alphabetic';
  // 能量条
  const ew = Math.min(viewW * .3, 380);
  const drawEnergy = (f, x, mirror) => {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x, VIEW_H - 40, ew, 14);
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1.5; ctx.strokeRect(x, VIEW_H - 40, ew, 14);
    const r = f.energy / 100;
    const g = ctx.createLinearGradient(x, 0, x + ew, 0);
    g.addColorStop(0, '#4da6ff'); g.addColorStop(1, '#b06cff');
    ctx.fillStyle = g;
    if (mirror) ctx.fillRect(x + ew - ew * r, VIEW_H - 40, ew * r, 14);
    else ctx.fillRect(x, VIEW_H - 40, ew * r, 14);
    if (r >= 1) {
      ctx.fillStyle = `rgba(255,255,255,${.5 + Math.sin(Date.now() * .01) * .4})`;
      ctx.font = 'bold 16px sans-serif'; ctx.textAlign = mirror ? 'right' : 'left';
      ctx.fillText('MAX 必杀可放!', mirror ? x + ew : x, VIEW_H - 48);
    }
  };
  drawEnergy(a, 20, false);
  drawEnergy(b, viewW - 20 - ew, true);
  // 连击
  for (const f of game.fighters) {
    if (f.combo >= 2) {
      const x = f.player === 0 ? viewW * .18 : viewW * .82;
      ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd23c'; ctx.strokeStyle = '#7a3c00'; ctx.lineWidth = 5;
      ctx.strokeText(f.combo + ' HITS!', x, 200); ctx.fillText(f.combo + ' HITS!', x, 200);
    }
  }
  // 中央大字
  if (game.msgT < 200 && game.msg) {
    const t = game.msgT, s = Math.min(1, t / 8) * (t > 140 ? Math.max(0, 1 - (t - 140) / 20) : 1);
    ctx.save(); ctx.globalAlpha = s;
    ctx.font = `bold ${game.msg === 'FIGHT!' ? 90 : 110}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 10; ctx.strokeStyle = '#7a3c00';
    ctx.fillStyle = game.msg === 'K.O.' ? '#ff3b30' : '#ffd23c';
    ctx.strokeText(game.msg, viewW / 2, VIEW_H / 2 - 40);
    ctx.fillText(game.msg, viewW / 2, VIEW_H / 2 - 40);
    ctx.restore();
  }
}

// ---------------- 场景渲染 ----------------
function drawMenu() {
  drawStage();
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, viewW, VIEW_H);
  // 标题
  ctx.textAlign = 'center';
  ctx.font = 'bold 130px sans-serif';
  ctx.lineWidth = 14; ctx.strokeStyle = '#7a3c00';
  const tg = ctx.createLinearGradient(0, 120, 0, 260);
  tg.addColorStop(0, '#fff3c0'); tg.addColorStop(.5, '#ffd23c'); tg.addColorStop(1, '#e0861a');
  ctx.strokeText('激  斗', viewW / 2, 240); ctx.fillStyle = tg; ctx.fillText('激  斗', viewW / 2, 240);
  ctx.font = 'bold 30px sans-serif'; ctx.fillStyle = '#c8b8ff';
  ctx.fillText('— GEKIDO FIGHTERS —', viewW / 2, 292);
  // 演示角色
  const demoL = { char: CHARS[0], facing: 1, player: 0, state: 'idle', animPose: POSES.punch, walkPhase: 0 };
  const demoR = { char: CHARS[1], facing: -1, player: 1, state: 'idle', animPose: POSES.kick, walkPhase: 0 };
  drawFighterFigure(demoL, viewW / 2 - 260, GROUND_Y, POSES.punch, 1.1, .9);
  drawFighterFigure(demoR, viewW / 2 + 260, GROUND_Y, POSES.kick, 1.1, .9);
  // 选项
  const opts = ['单人挑战  CPU', '双人对战  VS'];
  menuRects = [];
  ctx.font = 'bold 34px sans-serif';
  opts.forEach((o, i) => {
    const y = 400 + i * 76, w = 380, h = 56, x = viewW / 2 - w / 2;
    const on = game.menuSel === i;
    ctx.fillStyle = on ? 'rgba(255,210,60,.25)' : 'rgba(255,255,255,.07)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = on ? '#ffd23c' : 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = on ? '#ffd23c' : '#ddd';
    ctx.fillText(o, viewW / 2, y + 39);
    menuRects.push({ x, y, w, h, i });
  });
  ctx.font = '20px sans-serif'; ctx.fillStyle = '#889';
  ctx.fillText('P1: WASD移动  J拳 K脚 L必杀(能量满)   /   P2: 方向键移动  1拳 2脚 3必杀', viewW / 2, 600);
  ctx.fillText('后拉=防御 · 下+后=蹲防 · 拳脚命中后可取消连招 · 三局两胜', viewW / 2, 632);
  ctx.fillText(IS_TOUCH ? '触屏: 点按选项开始' : 'W/S选择 · J确认', viewW / 2, 670);
}
let menuRects = [], selRects = [];

function drawSelect() {
  drawStage();
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, viewW, VIEW_H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 52px sans-serif'; ctx.fillStyle = '#ffd23c';
  ctx.fillText('选 择 角 色', viewW / 2, 110);
  selRects = [];
  const cw = Math.min(viewW * .34, 420), ch = 420;
  CHARS.forEach((c, i) => {
    const x = viewW / 2 + (i === 0 ? -cw - 40 : 40), y = 160;
    const p1on = game.sel[0] === i, p2on = game.mode === 1 && game.sel[1] === i;
    ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(x, y, cw, ch);
    ctx.lineWidth = 4;
    ctx.strokeStyle = p1on && p2on ? '#c07bff' : p1on ? '#4da6ff' : p2on ? '#ff5040' : 'rgba(255,255,255,.2)';
    ctx.strokeRect(x, y, cw, ch);
    // 立绘
    const demo = { char: c, facing: i === 0 ? 1 : -1, player: i, animPose: POSES.idle, state: 'idle', walkPhase: 0 };
    drawFighterFigure(demo, x + cw / 2, y + 250, POSES.idle, 1.6);
    // 信息
    ctx.font = 'bold 38px sans-serif'; ctx.fillStyle = c.color;
    ctx.fillText(c.name + ' ' + c.en, x + cw / 2, y + 300);
    ctx.font = '20px sans-serif'; ctx.fillStyle = '#ccc';
    ctx.fillText(c.desc + ' · 必杀: ' + c.specialName, x + cw / 2, y + 330);
    // 属性条
    let sy = y + 352;
    for (const k in c.stats) {
      ctx.textAlign = 'left'; ctx.font = '17px sans-serif'; ctx.fillStyle = '#aaa';
      ctx.fillText(k, x + 40, sy + 13);
      for (let s = 0; s < 5; s++) {
        ctx.fillStyle = s < c.stats[k] ? c.color : 'rgba(255,255,255,.15)';
        ctx.fillRect(x + 90 + s * 34, sy, 28, 12);
      }
      ctx.textAlign = 'center'; sy += 24;
    }
    // 选择标记
    if (p1on) { ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#4da6ff'; ctx.fillText(game.selDone[0] ? 'P1 ✔' : 'P1 选择中', x + cw / 2, y - 14); }
    if (game.mode === 1 && p2on) { ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#ff5040'; ctx.fillText(game.selDone[1] ? 'P2 ✔' : 'P2 选择中', x + cw / 2, y + ch + 30); }
    selRects.push({ x, y, w: cw, h: ch, i });
  });
  ctx.font = '20px sans-serif'; ctx.fillStyle = '#889'; ctx.textAlign = 'center';
  if (game.mode === 0) ctx.fillText('P1: A/D选择 · J确认  (对手由电脑随机)', viewW / 2, 660);
  else ctx.fillText('P1: A/D选择 J确认      P2: ←/→选择 1确认', viewW / 2, 660);
}

function drawEnd() {
  drawStage();
  const w = game.fighters[game.winner];
  drawFighterFigure(w, viewW / 2, GROUND_Y, w.state === 'win' ? POSES.win : POSES.idle, 1.5);
  ctx.textAlign = 'center';
  ctx.font = 'bold 90px sans-serif';
  ctx.lineWidth = 10; ctx.strokeStyle = '#7a3c00';
  ctx.strokeText('WINNER', viewW / 2, 200);
  ctx.fillStyle = '#ffd23c'; ctx.fillText('WINNER', viewW / 2, 200);
  ctx.font = 'bold 60px sans-serif'; ctx.fillStyle = w.char.color;
  ctx.fillText(w.char.name + ' ' + w.char.en, viewW / 2, 280);
  const opts = ['再来一局', '返回菜单'];
  endRects = [];
  ctx.font = 'bold 30px sans-serif';
  opts.forEach((o, i) => {
    const x = viewW / 2 - 150 + i * 320 - 10, y = 560, ww = 180, hh = 54;
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(x, y, ww, hh);
    ctx.strokeStyle = '#ffd23c'; ctx.lineWidth = 2; ctx.strokeRect(x, y, ww, hh);
    ctx.fillStyle = '#ffd23c'; ctx.fillText(o, x + ww / 2, y + 37);
    endRects.push({ x, y, w: ww, h: hh, i });
  });
  ctx.font = '18px sans-serif'; ctx.fillStyle = '#889';
  ctx.fillText('J = 再来一局    K = 返回菜单', viewW / 2, 660);
}
let endRects = [];

function render() {
  ctx.setTransform(scaleRatio, 0, 0, scaleRatio, 0, 0);
  ctx.clearRect(0, 0, viewW, VIEW_H);
  if (camShake > 0) ctx.translate((Math.random() - .5) * camShake, (Math.random() - .5) * camShake);

  if (game.scene === 'menu') { drawMenu(); return; }
  if (game.scene === 'select') { drawSelect(); return; }
  if (game.scene === 'end') { drawEnd(); return; }

  // fight
  drawStage();
  const [a, b] = game.fighters;
  // 阴影
  for (const f of game.fighters) {
    const sh = Math.max(.2, 1 - f.y / 500);
    ctx.fillStyle = `rgba(0,0,0,${.35 * sh})`;
    ctx.beginPath(); ctx.ellipse(f.x, GROUND_Y + 8, 44 * sh, 10 * sh, 0, 0, 7); ctx.fill();
  }
  // 角色（后手先画：y低者后画在上层无所谓，固定p0先）
  drawFighterFigure(a, a.x, GROUND_Y - a.y, currentPose(a), 1);
  drawFighterFigure(b, b.x, GROUND_Y - b.y, currentPose(b), 1);
  // 飞行道具
  for (const p of PROJECTILES) {
    const g = ctx.createRadialGradient(p.x, GROUND_Y - p.y, 2, p.x, GROUND_Y - p.y, 26);
    g.addColorStop(0, '#fff'); g.addColorStop(.4, '#8fd0ff'); g.addColorStop(1, 'rgba(80,140,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, GROUND_Y - p.y, 26, 0, 7); ctx.fill();
  }
  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;
  if (flashWhite > 0) { ctx.fillStyle = `rgba(255,255,255,${flashWhite / 24})`; ctx.fillRect(-40, -40, viewW + 80, VIEW_H + 80); flashWhite--; }
  drawHUD();
}

// ---------------- 主循环 ----------------
let lastT = 0, acc = 0;
const STEP = 1000 / 60;
function loop(t) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = t;
  acc += Math.min(t - lastT, 100);
  lastT = t;
  while (acc >= STEP) {
    acc -= STEP;
    if (hitstop > 0) { hitstop--; updateFX(); continue; }
    if (game.scene === 'fight') updateFight();
    else updateFX();
    menuLogic();
  }
  render();
}

// ---------------- 菜单/选人逻辑 ----------------
let keyPrev = {};
function pressed(code) { const v = keys[code] && !keyPrev[code]; return v; }
function menuLogic() {
  if (game.scene === 'menu') {
    if (pressed('KeyW') || pressed('ArrowUp')) { game.menuSel = (game.menuSel + 1) % 2; SFX.select(); }
    if (pressed('KeyS') || pressed('ArrowDown')) { game.menuSel = (game.menuSel + 1) % 2; SFX.select(); }
    if (pressed('KeyJ') || pressed('Enter') || pressed('Numpad1')) {
      game.mode = game.menuSel; game.scene = 'select';
      game.sel = [0, 1]; game.selDone = [false, false]; SFX.confirm();
    }
  } else if (game.scene === 'select') {
    if (!game.selDone[0]) {
      if (pressed('KeyA')) { game.sel[0] = (game.sel[0] + 1) % 2; SFX.select(); }
      if (pressed('KeyD')) { game.sel[0] = (game.sel[0] + 1) % 2; SFX.select(); }
      if (pressed('KeyJ')) {
        game.selDone[0] = true; SFX.confirm();
        if (game.mode === 0) { game.sel[1] = Math.random() * 2 | 0; game.selDone[1] = true; }
      }
    }
    if (game.mode === 1 && game.selDone[0] && !game.selDone[1]) {
      if (pressed('ArrowLeft')) { game.sel[1] = (game.sel[1] + 1) % 2; SFX.select(); }
      if (pressed('ArrowRight')) { game.sel[1] = (game.sel[1] + 1) % 2; SFX.select(); }
      if (pressed('Numpad1') || pressed('Digit1')) { game.selDone[1] = true; SFX.confirm(); }
    }
    if (game.selDone[0] && game.selDone[1]) { startMatch(); }
  } else if (game.scene === 'end') {
    if (pressed('KeyJ')) { SFX.confirm(); startMatch(); }
    if (pressed('KeyK')) { SFX.confirm(); game.scene = 'menu'; }
  }
  keyPrev = { ...keys };
}

// 触屏/鼠标点击界面
cvs.addEventListener('pointerdown', e => {
  audioInit();
  const x = e.clientX / innerWidth * viewW, y = e.clientY / innerHeight * VIEW_H;
  if (game.scene === 'menu') {
    for (const r of menuRects) if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h) {
      game.mode = r.i; game.scene = 'select'; game.sel = [0, 1]; game.selDone = [false, false]; SFX.confirm();
    }
  } else if (game.scene === 'select') {
    for (const r of selRects) if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h) {
      if (!game.selDone[0]) {
        game.sel[0] = r.i; game.selDone[0] = true; SFX.confirm();
        if (game.mode === 0) { game.sel[1] = (game.sel[0] + 1) % 2; game.selDone[1] = true; }
      } else if (game.mode === 1 && !game.selDone[1]) { game.sel[1] = r.i; game.selDone[1] = true; SFX.confirm(); }
    }
  } else if (game.scene === 'end') {
    for (const r of endRects) if (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h) {
      SFX.confirm();
      if (r.i === 0) startMatch(); else game.scene = 'menu';
    }
  }
});

// ---------------- 触屏虚拟按键 ----------------
function buildTouchUI() {
  const ui = document.getElementById('touch-ui');
  ui.innerHTML = '';
  if (!IS_TOUCH || game.scene !== 'fight') return;
  const vmin = Math.min(innerWidth, innerHeight);
  const S = vmin * .17;   // 按钮直径
  const mk = (p, key, label, x, y, cls) => {
    const d = document.createElement('div');
    d.className = 'tbtn' + (cls ? ' ' + cls : '');
    d.textContent = label;
    d.style.cssText += `;left:${x - S / 2}px;top:${y - S / 2}px;width:${S}px;height:${S}px;font-size:${S * .32}px;`;
    const on = ev => { ev.preventDefault(); touchState[p][key] = true; d.classList.add('on'); };
    const off = ev => { ev.preventDefault(); touchState[p][key] = false; d.classList.remove('on'); };
    d.addEventListener('pointerdown', on);
    d.addEventListener('pointerup', off);
    d.addEventListener('pointercancel', off);
    d.addEventListener('pointerleave', off);
    ui.appendChild(d);
    return d;
  };
  const H = innerHeight, W = innerWidth;
  const p1atkX = game.mode === 0 ? W - vmin * .3 : W * .30;  // 双人时P1攻击键靠左半屏内侧
  const gap = S * 1.15;
  // P1 方向十字（左下）
  const cx1 = vmin * .28, cy1 = H - vmin * .26;
  mk(0, 'up', '↑', cx1, cy1 - gap);
  mk(0, 'left', '←', cx1 - gap, cy1);
  mk(0, 'down', '↓', cx1, cy1);
  mk(0, 'right', '→', cx1 + gap, cy1);
  // P1 攻击
  mk(0, 'punch', '拳', p1atkX, H - vmin * .38, 'atk');
  mk(0, 'kick', '脚', p1atkX + (game.mode === 0 ? -gap : gap), H - vmin * .2, 'atk');
  mk(0, 'special', '必', p1atkX + (game.mode === 0 ? gap * .2 : gap * 2), H - vmin * .36, 'sp');
  // P2（双人）
  if (game.mode === 1) {
    const cx2 = W - vmin * .28, cy2 = H - vmin * .26;
    mk(1, 'up', '↑', cx2, cy2 - gap);
    mk(1, 'left', '←', cx2 - gap, cy2);
    mk(1, 'down', '↓', cx2, cy2);
    mk(1, 'right', '→', cx2 + gap, cy2);
    const p2atkX = W * .70;
    mk(1, 'punch', '拳', p2atkX, H - vmin * .38, 'atk');
    mk(1, 'kick', '脚', p2atkX - gap, H - vmin * .2, 'atk');
    mk(1, 'special', '必', p2atkX - gap * 2, H - vmin * .36, 'sp');
  }
  // 能量满高亮
  clearInterval(buildTouchUI._spTimer);
  buildTouchUI._spTimer = setInterval(() => {
    if (game.scene !== 'fight') return;
    document.querySelectorAll('.tbtn.sp').forEach((el, i) => {
      const f = game.fighters[i === 0 ? 0 : 1];
      el.classList.toggle('max', f && f.energy >= 100);
    });
  }, 200);
}
window.addEventListener('resize', () => { if (game.scene === 'fight') buildTouchUI(); });
// 进入战斗时重建
const _origStartMatch = startMatch;
startMatch = function () { _origStartMatch(); buildTouchUI(); };
setInterval(() => { // 场景切换时同步触屏UI
  if (game.scene !== 'fight' && document.getElementById('touch-ui').children.length) document.getElementById('touch-ui').innerHTML = '';
}, 500);

// ---------------- 横屏检测（多信号） ----------------
function checkOrientation() {
  const tip = document.getElementById('rotate-tip');
  const portrait = innerHeight > innerWidth;
  const mq = window.matchMedia('(orientation: portrait)').matches;
  tip.style.display = (portrait || mq) && IS_TOUCH ? 'flex' : 'none';
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 300));
if (window.visualViewport) window.visualViewport.addEventListener('resize', checkOrientation);
checkOrientation();
document.getElementById('btn-rotate').addEventListener('click', async () => {
  audioInit();
  try {
    await document.documentElement.requestFullscreen();
    await screen.orientation.lock('landscape');
  } catch (e) {}
  setTimeout(checkOrientation, 400);
});

requestAnimationFrame(loop);
</script>
